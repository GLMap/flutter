name: glmap
description: Native online and offline maps, 3D terrain, markers and vector drawings for Flutter on Android and iOS.
version: 0.1.0-beta.1
homepage: https://globus.software
repository: https://github.com/GLMap/flutter/tree/main/packages/glmap
issue_tracker: https://github.com/GLMap/flutter/issues
resolution: workspace
environment:
  sdk: ^3.13.3
  flutter: '>=3.47.4'
dependencies:
  flutter:
    sdk: flutter
  meta: ^1.19.0
  glmap_core: ^0.1.0-beta.1
dev_dependencies:
  pigeon: 29.0.1
flutter:
  plugin:
    platforms:
      android:
        package: software.globus.flutter.glmap
        pluginClass: GLMapPlugin
      ios:
        pluginClass: GLMapPlugin
