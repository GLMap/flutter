name: glsearch
description: Online and offline place search and autocomplete for Flutter on Android and iOS, without requiring a map view.
version: 0.1.0-beta.1
homepage: https://globus.software
repository: https://github.com/GLMap/flutter/tree/main/packages/glsearch
issue_tracker: https://github.com/GLMap/flutter/issues
resolution: workspace
environment:
  sdk: ^3.13.3
  flutter: '>=3.47.4'
dependencies:
  flutter:
    sdk: flutter
  meta: ^1.19.0
  glmap_core: ^0.1.0-beta.1
dev_dependencies:
  pigeon: 29.0.1
flutter:
  plugin:
    platforms:
      android:
        package: software.globus.flutter.glsearch
        pluginClass: GLSearchPlugin
      ios:
        pluginClass: GLSearchPlugin
