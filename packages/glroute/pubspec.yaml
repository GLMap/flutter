name: glroute
description: Globus glroute SDK for Flutter on Android and iOS.
version: 0.1.0-beta.1
homepage: https://globus.software
publish_to: none
resolution: workspace
environment:
  sdk: ^3.13.3
  flutter: '>=3.47.4'
dependencies:
  flutter:
    sdk: flutter
  meta: ^1.19.0
  glmap_core: ^0.1.0-beta.1
dev_dependencies:
  pigeon: 29.0.1
flutter:
  plugin:
    platforms:
      android:
        package: software.globus.flutter.glroute
        pluginClass: GLRoutePlugin
      ios:
        pluginClass: GLRoutePlugin
