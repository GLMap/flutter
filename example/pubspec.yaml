name: glmap_lab_example
description: GLMap cross-platform lab — Flutter stage A.
publish_to: none
version: 0.0.1+1
environment:
  sdk: ^3.13.3
dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.0.3
  glmap_flutter:
    path: ../
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/stage-a.json
    - assets/Montenegro.vm
    - assets/valhalla.json
    - assets/uk_postcodes.geojson
    - assets/track-arrow.svg
