name: glmap_example
description: GLMap Flutter demo catalog and public API lifecycle examples.
publish_to: none
resolution: workspace
version: 0.0.1+1
environment:
  sdk: ^3.13.3
dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.0.3
  glmap_core: 0.1.0-beta.1
  glmap: 0.1.0-beta.1
  glsearch: 0.1.0-beta.1
  glroute: 0.1.0-beta.1
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/stage-a.json
    - assets/Montenegro.vm
    - assets/valhalla.json
    - assets/uk_postcodes.geojson
    - assets/track-arrow.svg
